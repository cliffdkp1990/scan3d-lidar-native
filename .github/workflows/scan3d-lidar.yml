name: Scan3D - source tests and iOS Simulator build
on:
  push:
    branches: [main]
    paths:
      - 'Scan3DLiDAR/**'
      - '.github/workflows/scan3d-lidar.yml'
  pull_request:
    paths:
      - 'Scan3DLiDAR/**'
      - '.github/workflows/scan3d-lidar.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scan3d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-build:
    name: Test and compile actual repository source
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Test mission, current photo frame and exports
        shell: bash
        run: |
          set -euo pipefail
          cd Scan3DLiDAR
          swiftc Sources/MissionGeometry.swift Tests/mission/main.swift -o "$RUNNER_TEMP/mission-tests"
          "$RUNNER_TEMP/mission-tests"
          swiftc Sources/MissionGeometry.swift Tests/capture/main.swift -o "$RUNNER_TEMP/capture-tests"
          "$RUNNER_TEMP/capture-tests"
          swiftc Sources/GeometryExport.swift Tests/export/main.swift -o "$RUNNER_TEMP/export-tests"
          "$RUNNER_TEMP/export-tests"
          swiftc Sources/AutomaticCapture.swift Tests/automatic/main.swift -o "$RUNNER_TEMP/automatic-tests"
          "$RUNNER_TEMP/automatic-tests"
          swiftc Sources/ProjectStore.swift Tests/projects/main.swift -o "$RUNNER_TEMP/project-tests"
          "$RUNNER_TEMP/project-tests"
          swiftc Sources/ProjectStore.swift Sources/VideoTimeline.swift Sources/VideoRecorder.swift Tests/video/main.swift -o "$RUNNER_TEMP/video-tests"
          "$RUNNER_TEMP/video-tests"
      - name: Prepare Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          cd Scan3DLiDAR
          xcodegen generate
      - name: Compile unsigned iOS Simulator app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Scan3DLiDAR/Scan3DLiDAR.xcodeproj \
            -scheme Scan3DLiDAR -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/Scan3DBuild" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/scan3d-build.log"
      - name: Save compiler report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan3d-source-build-report
          path: ${{ runner.temp }}/scan3d-build.log
          if-no-files-found: ignore
          retention-days: 7
