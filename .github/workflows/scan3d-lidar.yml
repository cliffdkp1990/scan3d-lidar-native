name: Scan3D - source tests and iOS Simulator build
on:
  push:
    branches: [main]
    paths:
      - 'Scan3DLiDAR/**'
      - '.github/workflows/scan3d-lidar.yml'
  pull_request:
    paths:
      - 'Scan3DLiDAR/**'
      - '.github/workflows/scan3d-lidar.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scan3d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-build:
    name: Test and compile actual repository source
    # Intel CI crashes inside RealityKit's texture manager before the fixture screen opens.
    # Keep native rendering tests on Apple Silicon, where this app previously passed.
    runs-on: macos-26
    # The Xcode 26 runner needs a fresh Simulator build, native tests and two Release builds.
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SCAN3D_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SCAN3D_SOURCE_COMMIT }}
      - name: Select Xcode 26.6 and prepare Simulator
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          python3 - <<'PY'
          import json,os,pathlib,subprocess,uuid
          def output(args): return subprocess.check_output(args,text=True).strip()
          devices=json.loads(output(['xcrun','simctl','list','devices','available','--json']))['devices']
          matches=[(runtime,device) for runtime,items in devices.items() if runtime.endswith('.iOS-26-5')
                   for device in items if device['name'].startswith('iPhone')]
          matches.sort(key=lambda item:(item[1]['name']!='iPhone 16 Pro',item[1]['name']))
          if not matches: raise SystemExit('Required iOS 26.5 Simulator is missing. Available runtimes: '+', '.join(devices))
          runtime,device=matches[0]
          simulator=str(uuid.UUID(device['udid'])).upper()
          evidence={'schemaVersion':1,'xcodeVersion':output(['xcodebuild','-version']),'hostArchitecture':output(['uname','-m']),
                    'iphoneosSDK':output(['xcrun','--sdk','iphoneos','--show-sdk-version']),
                    'simulatorRuntime':runtime,'simulatorDevice':device['name'],'simulatorId':simulator}
          print(json.dumps(evidence,indent=2))
          pathlib.Path(os.environ['RUNNER_TEMP'],'scan3d-environment.json').write_text(json.dumps(evidence,indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as file: file.write('SCAN3D_SIMULATOR_ID='+simulator+'\n')
          PY
      - name: Test mission, current photo frame and exports
        shell: bash
        run: |
          set -euo pipefail
          cd Scan3DLiDAR
          python3 -m unittest discover -s Tests/packaging -v
          swiftc Sources/MissionGeometry.swift Tests/mission/main.swift -o "$RUNNER_TEMP/mission-tests"
          "$RUNNER_TEMP/mission-tests"
          swiftc Sources/MissionGeometry.swift Tests/capture/main.swift -o "$RUNNER_TEMP/capture-tests"
          "$RUNNER_TEMP/capture-tests"
          swiftc Sources/GeometryExport.swift Tests/export/main.swift -o "$RUNNER_TEMP/export-tests"
          "$RUNNER_TEMP/export-tests"
          swiftc Sources/GeometryExport.swift Sources/GeometryPreview.swift Tests/geometry-preview/main.swift -o "$RUNNER_TEMP/geometry-preview-tests"
          "$RUNNER_TEMP/geometry-preview-tests"
          swiftc Sources/GeometryExport.swift Sources/GeometryPreview.swift Sources/MissionGeometry.swift Sources/CaptureQuality.swift Sources/LumaBufferSampler.swift Sources/DepthBufferSampler.swift Tests/quality/main.swift -o "$RUNNER_TEMP/capture-quality-tests"
          "$RUNNER_TEMP/capture-quality-tests"
          swiftc Sources/AutomaticCapture.swift Tests/automatic/main.swift -o "$RUNNER_TEMP/automatic-tests"
          "$RUNNER_TEMP/automatic-tests"
          swiftc Sources/ProjectStore.swift Tests/projects/main.swift -o "$RUNNER_TEMP/project-tests"
          "$RUNNER_TEMP/project-tests"
          swiftc Sources/ProjectStore.swift Sources/VideoTimeline.swift Sources/VideoRecorder.swift Tests/video/main.swift -o "$RUNNER_TEMP/video-tests"
          "$RUNNER_TEMP/video-tests"
      - name: Prepare Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          cd Scan3DLiDAR
          xcodegen generate
          # Codec source tests finish before Simulator services compete for media/GPU resources.
          xcrun simctl boot "$SCAN3D_SIMULATOR_ID" || true
      - name: Compile unsigned iOS Simulator app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Scan3DLiDAR/Scan3DLiDAR.xcodeproj \
            -scheme Scan3DLiDAR -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/Scan3DBuild" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/scan3d-build.log"
      - name: Save compiler report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan3d-source-build-report
          path: ${{ runner.temp }}/scan3d-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Run native camera and model-viewer UI tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SCAN3D_SIMULATOR_ID" -b
          xcodebuild test -project Scan3DLiDAR/Scan3DLiDAR.xcodeproj \
            -scheme Scan3DLiDAR -configuration Debug -destination "platform=iOS Simulator,id=$SCAN3D_SIMULATOR_ID" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -derivedDataPath "$RUNNER_TEMP/Scan3DBuild" -resultBundlePath "$RUNNER_TEMP/Scan3D-UI.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/scan3d-ui.log"
      - name: Compile Release without test fixture activation
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Scan3DLiDAR/Scan3DLiDAR.xcodeproj -scheme Scan3DLiDAR \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/Scan3DRelease" CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/scan3d-release.log"
      - name: Compile unsigned iOS device app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Scan3DLiDAR/Scan3DLiDAR.xcodeproj -scheme Scan3DLiDAR \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Scan3DDevice" CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/scan3d-device.log"
      - name: Package unsigned iPhone app for local signing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SCAN3D_SOURCE_COMMIT"
          python3 Scan3DLiDAR/scripts/package_unsigned_ipa.py \
            --app "$RUNNER_TEMP/Scan3DDevice/Build/Products/Release-iphoneos/Scan3DLiDAR.app" \
            --output "$RUNNER_TEMP/scan3d-unsigned-iphone" --source-commit "$SCAN3D_SOURCE_COMMIT"
      - name: Save unsigned iPhone package
        uses: actions/upload-artifact@v4
        with:
          name: scan3d-unsigned-iphone
          path: ${{ runner.temp }}/scan3d-unsigned-iphone
          if-no-files-found: error
          retention-days: 7
      - name: Export native screenshots and UI report
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/Scan3D-UI.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Scan3D-UI.xcresult" --output-path "$RUNNER_TEMP/scan3d-ui-attachments"
          fi
          SCAN3D_APP_CONTAINER=$(xcrun simctl get_app_container "${SCAN3D_SIMULATOR_ID:-booted}" dk.scan3dstudio.lidar data 2>/dev/null || true)
          if [ -n "$SCAN3D_APP_CONTAINER" ] && [ -f "$SCAN3D_APP_CONTAINER/tmp/Scan3D-Viewer-Trace.log" ]; then
            cp "$SCAN3D_APP_CONTAINER/tmp/Scan3D-Viewer-Trace.log" "$RUNNER_TEMP/scan3d-viewer-trace.log"
          fi
      - name: Save native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan3d-native-ui-evidence
          path: |
            ${{ runner.temp }}/scan3d-ui.log
            ${{ runner.temp }}/scan3d-release.log
            ${{ runner.temp }}/scan3d-device.log
            ${{ runner.temp }}/scan3d-environment.json
            ${{ runner.temp }}/scan3d-video-diagnostics
            ${{ runner.temp }}/scan3d-viewer-trace.log
            ${{ runner.temp }}/scan3d-ui-attachments
          if-no-files-found: ignore
          retention-days: 7
