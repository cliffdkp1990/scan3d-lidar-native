name: Scan3D - free Windows install preflight
on:
  pull_request:
    paths: ['integration/windows/**', 'integration/iphone/**', 'docs/IPHONE_CONTINUOUS_USE_DA.md', '.github/workflows/scan3d-windows-preflight.yml']
permissions:
  contents: read
jobs:
  preflight-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Hash and readiness regression tests without signing or installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne $env:SOURCE_COMMIT) { throw 'Wrong checkout' }
          ./integration/windows/Test-Scan3D-Free.ps1
          $report = @{
            checkout = (git rev-parse HEAD)
            runId = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            powershell = $PSVersionTable.PSVersion.ToString()
            checks = 11
            passed = $true
            installerExecuted = $false
            appleLogin = $false
            physicalIPhone = $false
            physicalLiDAR = $false
            renewalVerified = $false
          }
          $report | ConvertTo-Json | Set-Content windows-preflight-tested.json -Encoding utf8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate unsigned iPhone automation draft without upload or signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s integration/iphone -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Shortcut tests failed' }
          python integration/iphone/build_shortcut.py --output iphone-shortcut-draft
          if ($LASTEXITCODE -ne 0) { throw 'Shortcut draft build failed' }
          python integration/iphone/build_shortcut.py --validate-plist iphone-shortcut-draft/Scan3D-Forny.UNSIGNED.plist
          if ($LASTEXITCODE -ne 0) { throw 'Shortcut draft validation failed' }
          @{
            checkout = (git rev-parse HEAD)
            runId = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            checks = 10
            passed = $true
            signed = $false
            physicalIPhone = $false
            renewalVerified = $false
            draft = (Get-Content iphone-shortcut-draft/SHORTCUT_DRAFT.json -Raw | ConvertFrom-Json)
          } | ConvertTo-Json -Depth 10 | Set-Content iphone-shortcut-tested.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: scan3d-windows-preflight-${{ env.SOURCE_COMMIT }}
          path: |
            windows-preflight-tested.json
            iphone-shortcut-tested.json
            iphone-shortcut-draft/
          if-no-files-found: error
          retention-days: 7
