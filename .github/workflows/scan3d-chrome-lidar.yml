name: Scan3D - Chrome local RGBD receiver
on:
  pull_request:
    paths: ['web/safari-mvp/**', 'docs/CHROME_LIDAR_DA.md', 'docs/third-party/**', '.github/workflows/scan3d-chrome-lidar.yml']
permissions:
  contents: read
concurrency:
  group: scan3d-chrome-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  chrome-rgbd:
    name: Google Chrome and WebKit RGBD tests (synthetic)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web/safari-mvp
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve native source and existing CI policies
        id: isolation
        working-directory: ${{ github.workspace }}
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: git diff --exit-code "$BASE_COMMIT" "$SOURCE_COMMIT" -- Scan3DLiDAR .github/workflows/scan3d-lidar.yml .github/workflows/scan3d-doctor.yml scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - name: Install locked test tools and actual Google Chrome
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chrome webkit
      - name: Unit and security tests including bounded local HTTP relay
        id: unit
        run: pnpm test
      - name: Chrome regression, synthetic RGBD, real loopback WebRTC and WebKit compatibility
        id: browser
        run: pnpm exec playwright test --config playwright.chrome.config.mjs
      - name: Record exact revision and limits
        if: always()
        env:
          UNIT: ${{ steps.unit.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          ISOLATION: ${{ steps.isolation.outcome }}
        run: |
          mkdir -p test-results
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const checkout=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          let stats=null;try{stats=JSON.parse(fs.readFileSync('test-results/chrome-results.json')).stats;}catch{}
          const passed=checkout===process.env.SOURCE_COMMIT&&process.env.UNIT==='success'&&process.env.BROWSER==='success'&&process.env.ISOLATION==='success'&&stats?.expected===108&&!stats.unexpected&&!stats.flaky&&!stats.skipped;
          const report={checkout,prHead:process.env.SOURCE_COMMIT,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,node:process.version,unit:process.env.UNIT,browser:process.env.BROWSER,nativeIsolation:process.env.ISOLATION,stats,passed,physicalIPhone:false,physicalLiDAR:false,record3DHardware:false,signed:false,deployed:false};
          fs.writeFileSync('test-results/CHROME_TESTED_COMMIT.json',JSON.stringify(report,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Exact tested checkout: `'+checkout+'`. Actual Google Chrome, synthetic RGBD and same-computer WebRTC only. No physical iPhone, LiDAR or Record3D evidence.\n');
          if(!passed)process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan3d-chrome-rgbd-${{ env.SOURCE_COMMIT }}
          path: web/safari-mvp/test-results/
          if-no-files-found: error
          retention-days: 7
