name: Scan3D Studio - read-only public PWA audit

# This NEVER modifies Vercel. Only fetches three static, public assets
# from the fixed production domain. No Apple account, secrets or upload.
on:
  pull_request:
    paths:
      - 'tools/pwa/**'
      - '.github/workflows/scan3d-studio-public-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-studio:
    name: Confirm public Studio manifest and offline worker without login
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AUDIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit immutable fixed HTTPS production URL (no login or writes)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDIT_COMMIT"
          node tools/pwa/check-live-studio.mjs "$RUNNER_TEMP/scan3d-public-audit"
      - name: Produce a read-only candidate for the exact audited production worker
        run: |
          set -euo pipefail
          node tools/pwa/patch-live-studio.mjs "$RUNNER_TEMP/scan3d-public-audit/sw.js" "$RUNNER_TEMP/scan3d-public-audit/sw.candidate.js"
          node --check "$RUNNER_TEMP/scan3d-public-audit/sw.candidate.js"
      - name: Prove candidate does not break offline use or touch project data
        run: |
          set -euo pipefail
          node tools/pwa/test-live-worker.mjs "$RUNNER_TEMP/scan3d-public-audit/sw.js" "$RUNNER_TEMP/scan3d-public-audit/sw.candidate.js"
      - name: Test public source recovery and no-data-access boundaries
        run: |
          set -euo pipefail
          node tools/pwa/test-snapshot-live-studio.mjs "$RUNNER_TEMP/scan3d-public-audit"
      - name: Preserve exact public Studio files and source checksums (review only)
        run: |
          set -euo pipefail
          node tools/pwa/snapshot-live-studio.mjs "$RUNNER_TEMP/scan3d-public-audit" "$RUNNER_TEMP/scan3d-public-audit/verified-source"
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          const r=JSON.parse(await readFile(process.env.RUNNER_TEMP+'/scan3d-public-audit/verified-source/PUBLIC_SOURCE_RECEIPT.json','utf8'));
          if(r.filesVerified!==29||r.writeToProduction!==false||r.readyForDeployment!==false||
             r.isCompleteDeploymentSource!==false||r.referenceWorkerSHA256!=='1e67705b53780b6dae90e14615fc0d76259f34f15fcdc5b31dc21678270d0278')
            throw new Error('Original public Studio source snapshot is incomplete or unsafe');
          console.log('Original Studio source files verified:',r.filesVerified,'assets;',r.bytesVerified,'public bytes; no project data or writes.');
          JS
      - name: Store precise public-source evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan3d-studio-public-pwa-audit-${{ env.AUDIT_COMMIT }}
          path: ${{ runner.temp }}/scan3d-public-audit/
          if-no-files-found: warn
          retention-days: 7
