<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1500" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
<title id="title">Scan3D Studio · Naturlige overflader · design v0.6</title>
<desc id="desc">iPhone koncept med tydeligt livekamera, naturlige metaloverflader, diskret grøn toning af plane flader og tynde konturer ved vinkelbrud. Kun visualisering, ingen fysisk LiDAR-scanning.</desc>
