<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#202c33"/><stop offset="1" stop-color="#0a1218"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#a3aea8"/><stop offset=".55" stop-color="#dadfda"/><stop offset="1" stop-color="#b8c5c3"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#a98565"/><stop offset=".4" stop-color="#926e51"/><stop offset="1" stop-color="#554839"/></linearGradient>
<linearGradient id="front" x1=".1" y1="0" x2="1" y2="1"><stop stop-color="#8c9d99"/><stop offset=".5" stop-color="#637875"/><stop offset="1" stop-color="#3c4d4f"/></linearGradient>
