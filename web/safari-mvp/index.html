<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scan3D Safari-test</title>
<style>body{font:18px system-ui;background:#101923;color:#f5f7fb;margin:0;padding:20px;max-width:760px;margin:auto}h1{font-size:2rem}button,input{font:inherit}button,.upload{display:inline-block;background:#d6ab58;color:#141414;padding:14px;border:0;border-radius:12px;margin:5px 5px 5px 0;font-weight:700}input[type=file]{max-width:100%}article{background:#202d3b;border-radius:16px;padding:16px;margin:16px 0}img{max-width:100%;max-height:340px;border-radius:12px}small{color:#d4dae2}button:focus-visible{outline:3px solid white}#status{min-height:2em}</style></head><body>
<h1>📷 Scan3D · Safari-test</h1><p>Tag fotos, gem lokalt og åbn projekter igen. Dette er <strong>ikke</strong> en LiDAR-scanner.</p>
<label for="photo">Vælg eller tag foto:</label><input id="photo" type="file" accept="image/*" capture="environment">
<p><button id="new">Nyt projekt</button><button id="export">Eksportér projekt</button><label class="upload">Importér projekt <input id="import" type="file" accept="application/json,.json" hidden></label></p>
<p id="status" role="status" aria-live="polite"></p><section id="projects"></section>
<script>
'use strict';
const KEY='scan3d-safari-mvp-v1';let projects=[];
const status=(message)=>document.querySelector('#status').textContent=message;
try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(data))projects=data}catch{status('Lokalt lager kunne ikke læses. Eksportér eksisterende data, hvis muligt.')}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(projects));return true}catch{status('Lageret er fuldt eller blokeret. Eksportér projektet, og frigør plads.');return false}};
const uid=()=>crypto.randomUUID?.()||String(Date.now())+'-'+Math.random();
const safeText=(value)=>String(value).slice(0,120);
function render(){const root=document.querySelector('#projects');root.replaceChildren();for(const p of projects){const card=document.createElement('article');const title=document.createElement('h2');title.textContent=safeText(p.name);card.append(title);const meta=document.createElement('small');meta.textContent=p.photos.length+' foto(s)';card.append(meta);for(const photo of p.photos){const img=document.createElement('img');img.src=photo;img.alt='Gemt projektfoto';img.loading='lazy';card.append(document.createElement('p'),img)}const open=document.createElement('button');open.textContent='Brug dette projekt';open.onclick=()=>{active=p.id;status('Projekt valgt: '+p.name)};card.append(open);root.append(card)}}
let active=projects[0]?.id||null;
document.querySelector('#new').onclick=()=>{const p={id:uid(),name:'Projekt '+new Date().toLocaleString('da-DK'),photos:[]};projects.unshift(p);if(save()){active=p.id;render();status('Nyt projekt oprettet')}else projects.shift()};
document.querySelector('#photo').onchange=async(e)=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){status('Vælg et billede');return}if(file.size>12*1024*1024){status('Fotoet er for stort. Vælg et billede under 12 MB.');return}if(!active)document.querySelector('#new').click();const p=projects.find(x=>x.id===active);if(!p)return;try{const image=await createImageBitmap(file);const scale=Math.min(1,1280/image.width,1280/image.height);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);image.close();p.photos.push(canvas.toDataURL('image/jpeg',0.72));if(save()){render();status('Foto gemt lokalt')}else p.photos.pop()}catch{status('Kunne ikke behandle billedet')}e.target.value=''};
document.querySelector('#export').onclick=()=>{const p=projects.find(x=>x.id===active);if(!p){status('Opret eller vælg et projekt først');return}const blob=new Blob([JSON.stringify({version:1,project:p})],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='scan3d-projekt.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('Projekt eksporteret')};
document.querySelector('#import').onchange=async(e)=>{const file=e.target.files?.[0];if(!file)return;if(file.size>15*1024*1024){status('Importfilen er for stor');return}try{const data=JSON.parse(await file.text());const p=data.project;if(data.version!==1||!p||!Array.isArray(p.photos)||p.photos.length>20||!p.photos.every(x=>typeof x==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(x))){throw Error('invalid')}const next={id:uid(),name:safeText(p.name||'Importeret projekt'),photos:p.photos};projects.unshift(next);if(save()){active=next.id;render();status('Projekt importeret')}else projects.shift()}catch{status('Ugyldig projektfil')}e.target.value=''};
render();
</script></body></html>
