name: Scan3DLiDAR
options:
  bundleIdPrefix: dk.scan3dstudio
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    SWIFT_STRICT_CONCURRENCY: minimal
    SUPPORTS_MACCATALYST: 'NO'
targets:
  Scan3DLiDAR:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.scan3dstudio.lidar
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_NSCameraUsageDescription: 'Scan3D bruger kamera og LiDAR til fotos, video uden lyd og lokal 3D-geometri.'
        INFOPLIST_KEY_UIFileSharingEnabled: 'YES'
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: 'YES'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  Scan3DImageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ImageTests
    dependencies:
      - target: Scan3DLiDAR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.scan3dstudio.lidar.imagetests
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Scan3DLiDAR.app/Scan3DLiDAR'
        BUNDLE_LOADER: '$(TEST_HOST)'
  Scan3DUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Scan3DLiDAR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.scan3dstudio.lidar.uitests
        GENERATE_INFOPLIST_FILE: 'YES'
schemes:
  Scan3DLiDAR:
    build:
      targets:
        Scan3DLiDAR: all
    test:
      targets:
        - Scan3DImageTests
        - Scan3DUITests
      gatherCoverageData: false
